<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陪你天气 — 传统方案 vs 多源融合</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06080f;color:#e0e6ed;font-family:'SF Pro Display','Inter',-apple-system,system-ui,sans-serif;overflow:hidden;height:100vh}
:root{--blue:#495EE8;--yellow:#ffc100;--cyan:#ffc100;--green:#34d399;--amber:#e8a800;--red:#ef4444;--dim:#1e293b;--muted:#334155}

/* Layout */
.arena{display:grid;grid-template-rows:56px 48px 1fr 140px;height:100vh}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0a0e18;border-bottom:1px solid #1e293b}
.header h1{font-size:1.05rem;font-weight:600;background:linear-gradient(90deg,var(--blue),var(--yellow));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .live{display:flex;align-items:center;gap:8px;font-size:.78rem;color:#94a3b8}
.header .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.clock{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#64748b}

/* Data input bar */
.data-bar{display:flex;align-items:center;justify-content:center;gap:28px;background:#080c16;border-bottom:1px solid #111827;font-size:.72rem;color:#64748b;position:relative;overflow:hidden}
.data-bar .feed{display:flex;align-items:center;gap:6px}
.data-bar .feed .fdot{width:5px;height:5px;border-radius:50%;background:var(--cyan);animation:blink 2s infinite}
.data-bar .feed-val{font-family:'JetBrains Mono',monospace;color:#94a3b8}
.data-bar canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

/* Battle area */
.battle{display:grid;grid-template-columns:1fr 80px 1fr;background:#06080f;overflow:hidden}

/* Side panels */
.side{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.side-title{font-size:.68rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px}
.side-name{font-size:1.1rem;font-weight:700;margin-bottom:4px}

/* Left - traditional (muted) */
.left{background:#080b14;border-right:1px solid #111827}
.left .side-title{color:#475569}
.left .side-name{color:#64748b}
.left .metric-tag{background:#111827;color:#475569;border:1px solid #1e293b}

/* Right - Pep (vibrant) */
.right{background:#080d1a;border-left:1px solid rgba(73,94,232,.15)}
.right .side-title{color:var(--cyan)}
.right .side-name{background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.right .metric-tag{background:rgba(73,94,232,.1);color:var(--cyan);border:1px solid rgba(73,94,232,.2)}

/* VS divider */
.vs-divider{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#06080f;position:relative}
.vs-text{font-size:1.6rem;font-weight:800;color:#1e293b;text-shadow:0 0 20px rgba(73,94,232,.15);z-index:1}
.vs-line{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,#1e293b 20%,#1e293b 80%,transparent)}

/* Canvas areas */
.wave-area{height:50px;background:#0a0e17;border-radius:6px;border:1px solid #111827;overflow:hidden;position:relative}
.wave-area canvas{width:100%;height:100%}
.grid-area{flex:1;background:#0a0e17;border-radius:6px;border:1px solid #111827;overflow:hidden;position:relative;min-height:0}
.grid-area canvas{width:100%;height:100%}
.output-row{display:flex;gap:8px;align-items:center}
.metric-tag{font-size:.68rem;padding:3px 10px;border-radius:4px;font-family:'JetBrains Mono',monospace}
.output-val{font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:700}
.left .output-val{color:#64748b}
.right .output-val{color:var(--cyan);text-shadow:0 0 12px rgba(255,193,0,.3)}

/* Pipeline (Pep only) */
.pipeline{display:flex;align-items:center;gap:0;height:36px;margin-bottom:2px}
.pipe-node{display:flex;align-items:center;justify-content:center;font-size:.55rem;padding:0 8px;height:24px;border-radius:3px;background:#111827;color:#475569;border:1px solid #1e293b;white-space:nowrap;transition:all .3s}
.pipe-node.active{background:rgba(73,94,232,.15);color:var(--cyan);border-color:rgba(73,94,232,.3);box-shadow:0 0 8px rgba(73,94,232,.15)}
.pipe-arrow{color:#1e293b;font-size:.6rem;margin:0 2px}
.pipe-arrow.active{color:var(--cyan)}

/* Source labels for Pep */
.src-labels{display:flex;gap:6px;flex-wrap:wrap}
.src-badge{font-size:.58rem;padding:2px 6px;border-radius:3px;font-family:'JetBrains Mono',monospace}
.src-badge.gfs{background:rgba(73,94,232,.12);color:#60a5fa;border:1px solid rgba(73,94,232,.2)}
.src-badge.era5{background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.2)}
.src-badge.stn{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.2)}
.src-badge.radar{background:rgba(244,114,182,.12);color:#f472b6;border:1px solid rgba(244,114,182,.2)}

/* Bottom metrics */
.metrics-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#111827;border-top:1px solid #1e293b}
.mcard{background:#0a0e18;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.mcard .m-label{font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:#475569}
.mcard .m-compare{display:flex;align-items:center;gap:6px}
.mcard .m-bar-wrap{flex:1;height:6px;background:#111827;border-radius:3px;overflow:hidden}
.mcard .m-bar{height:100%;border-radius:3px;transition:width 1.5s ease}
.mcard .m-bar.trad{background:#334155}
.mcard .m-bar.pep{background:linear-gradient(90deg,var(--blue),var(--cyan))}
.mcard .m-val{font-size:.7rem;font-family:'JetBrains Mono',monospace;min-width:48px;text-align:right}
.mcard .m-val.trad{color:#475569}
.mcard .m-val.pep{color:var(--cyan)}
.mcard .m-side-label{font-size:.5rem;color:#334155;width:28px}

/* Probability distribution (Pep) */
.prob-dist{display:flex;align-items:flex-end;gap:2px;height:32px}
.prob-bar{flex:1;border-radius:2px 2px 0 0;transition:height .5s;min-width:0}
</style>
</head>
<body>
<div class="arena">
  <div class="header">
    <h1>陪你天气 — 传统方案 vs 多源融合</h1>
    <div class="live"><div class="dot"></div>实时数据流</div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="data-bar">
    <canvas id="particleBar"></canvas>
    <div class="feed"><div class="fdot"></div>TYJI <span class="feed-val" id="fGfs">--</span></div>
    <div class="feed"><div class="fdot"></div>CLDAS <span class="feed-val" id="fEra5">--</span></div>
    <div class="feed"><div class="fdot"></div>GFS <span class="feed-val" id="fStn">--</span></div>
    <div class="feed"><div class="fdot"></div>ERA5 <span class="feed-val" id="fWind">--</span></div>
    <span style="color:#334155">|</span>
    <span style="color:#475569">同源数据 → 分发至两套系统</span>
    <span style="color:#334155">|</span>
    <span style="color:#ffc100;font-weight:600">传统预报告诉你"明天有雨"，陪你天气告诉你"街道级每分钟降水概率"</span>
  </div>

  <div class="battle">
    <!-- LEFT: Traditional -->
    <div class="side left">
      <div class="side-title">通用气象预报</div>
      <div class="side-name">数值模式直出 · 无场景校准</div>
      <div class="src-labels">
        <span class="src-badge gfs" style="opacity:.5">GFS</span>
        <span class="src-badge era5" style="opacity:.35">ECMWF</span>
        <span class="src-badge stn" style="opacity:.35">GRAPES</span>
      </div>
      <div class="wave-area"><canvas id="cvTradWave"></canvas></div>
      <div class="grid-area"><canvas id="cvTradGrid"></canvas></div>
      <div class="output-row">
        <span class="metric-tag">降水预报</span>
        <span class="output-val" id="tradRisk">中等</span>
      </div>
      <div class="output-row">
        <span class="metric-tag">决策信号</span>
        <span class="output-val" id="tradSignal" style="font-size:1rem">—</span>
      </div>
    </div>

    <!-- VS -->
    <div class="vs-divider">
      <div class="vs-line"></div>
      <div class="vs-text">VS</div>
    </div>

    <!-- RIGHT: Pep -->
    <div class="side right">
      <div class="side-title">Pep 多源融合引擎</div>
      <div class="side-name">四源融合 · 1km/1min · 概率定量</div>
      <div class="src-labels">
        <span class="src-badge gfs">TYJI预报</span>
        <span class="src-badge era5">CLDAS观测</span>
        <span class="src-badge stn">GFS预报</span>
        <span class="src-badge radar">ERA5观测</span>
      </div>
      <div class="pipeline" id="pipeline"></div>
      <div class="wave-area"><canvas id="cvPepWave"></canvas></div>
      <div class="grid-area"><canvas id="cvPepGrid"></canvas></div>
      <div class="output-row">
        <span class="metric-tag">风险量化</span>
        <span class="output-val" id="pepRisk">r--</span>
      </div>
      <div class="output-row" style="gap:4px">
        <span class="metric-tag">概率分布</span>
        <div class="prob-dist" id="probDist"></div>
        <span class="metric-tag" style="margin-left:4px">风险研判</span>
        <span class="output-val" id="pepSignal" style="font-size:1rem;color:var(--green)">—</span>
      </div>
    </div>
  </div>

  <!-- Bottom metrics -->
  <div class="metrics-bar" id="metricsBar"></div>
</div>

  const lr=GEO.lonMax-GEO.lonMin, la=GEO.latMax-GEO.latMin;
  const sx=(W-2*pad)/lr, sy=(H-2*pad)/la, s=Math.min(sx,sy);
  const dw=lr*s, dh=la*s;
  return {ox:pad+(W-2*pad-dw)/2, oy:pad+(H-2*pad-dh)/2, dw, dh};
}
function geo2px(lon,lat,W,H,pad){
  const b=geoBounds(W,H,pad);
  return [b.ox+(lon-GEO.lonMin)/(GEO.lonMax-GEO.lonMin)*b.dw,
          b.oy+(GEO.latMax-lat)/(GEO.latMax-GEO.latMin)*b.dh];
}
function tracePoly(ctx,ring,W,H,pad){
  ring.forEach((p,i)=>{const[x,y]=geo2px(p[0],p[1],W,H,pad);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.closePath();
}
function drawAllDistricts(ctx,W,H,pad,fillFn,strokeStyle,lineWidth){
  SH.forEach((d,di)=>{
    d.c.forEach(poly=>{
      poly.forEach(ring=>{
        ctx.beginPath();tracePoly(ctx,ring,W,H,pad);
        if(fillFn)ctx.fillStyle=fillFn(di,d.n);
        if(fillFn)ctx.fill();
        if(strokeStyle){ctx.strokeStyle=strokeStyle;ctx.lineWidth=lineWidth||.5;ctx.stroke();}
      });
    });
  });
}
function clipShanghai(ctx,W,H,pad){
  ctx.beginPath();
  SH.forEach(d=>{d.c.forEach(poly=>{poly.forEach(ring=>{tracePoly(ctx,ring,W,H,pad);});});});
  ctx.clip();
}
function pointInShanghai(lon,lat){
  // Ray-casting for all district polygons
  for(const d of SH){
    for(const poly of d.c){
      for(const ring of poly){
        let inside=false;
        for(let i=0,j=ring.length-1;i<ring.length;j=i++){
          const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
          if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi))inside=!inside;
        }
        if(inside)return true;
      }
    }
  }
  return false;
}

// ── Particle bar canvas ──
const particles=[];
function initParticles(){
  const cv=document.getElementById('particleBar');
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.offsetWidth*dpr;cv.height=cv.offsetHeight*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const W=cv.offsetWidth,H=cv.offsetHeight;
  for(let i=0;i<40;i++) particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*1.5,r:Math.random()*1.5+.5,a:Math.random()});
  function draw(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{
      p.x+=p.vx;if(p.x>W)p.x=0;if(p.x<0)p.x=W;
      p.a=.3+Math.sin(Date.now()/1000+p.y)*.3;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,193,0,${p.a})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
}

// ── Wave canvases ──
function drawWave(canvasId, data, colors, multi=false){
  const cv=document.getElementById(canvasId);if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.offsetWidth*dpr;cv.height=cv.offsetHeight*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const W=cv.offsetWidth,H=cv.offsetHeight;
  let off=0;
  function draw(){
    ctx.clearRect(0,0,W,H);
    if(multi && Array.isArray(data[0])){
      data.forEach((d,si)=>{
        drawLine(ctx,d,W,H,colors[si]||'#495EE8',off,0.6);
      });
      // Fused line (average) — brighter, thicker
      const fused=data[0].map((_,i)=>{let s=0;data.forEach(d=>s+=d[i]||0);return s/data.length;});
      drawLine(ctx,fused,W,H,'#ffc100',off,1.0,2);
    } else {
      drawLine(ctx,data,W,H,colors[0]||'#334155',off,0.8);
    }
    off+=.15;
    requestAnimationFrame(draw);
  }
  draw();
}
function drawLine(ctx,data,W,H,color,off,alpha,lw=1){
  if(!data||!data.length)return;
  const max=Math.max(1,...data.map(Math.abs));
  ctx.beginPath();ctx.globalAlpha=alpha;
  const len=Math.min(data.length,80);
  for(let i=0;i<len;i++){
    const x=(i/len)*W;
    const idx=(i+Math.floor(off))%data.length;
    const y=H/2-(data[idx]||0)/max*(H*.38);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke();
  // Fill
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,color.replace(')',',0.15)').replace('rgb','rgba'));
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.fill();
  ctx.globalAlpha=1;
}

// ── Risk color palette (r1-r10) as RGB ──
const RISK_RGB=[
  [240,240,255],[216,218,252],[181,185,245],[146,154,238],[111,123,231],
  [73,94,232],[58,75,208],[44,57,184],[30,40,160],[17,24,136]
];
function riskToRGB(v){return RISK_RGB[Math.max(0,Math.min(9,Math.round(v)-1))];}

// ── Build smooth heatmap (bilinear interpolation) clipped to Shanghai ──
function buildHeatmap(grid,resW,resH){
  const rows=grid.length,cols=grid[0].length;
  const cv=document.createElement('canvas');cv.width=resW;cv.height=resH;
  const ctx=cv.getContext('2d');
  const img=ctx.createImageData(resW,resH);
  for(let py=0;py<resH;py++){
    for(let px=0;px<resW;px++){
      // Map pixel to geo
      const lon=GEO.lonMin+(px/resW)*(GEO.lonMax-GEO.lonMin);
      const lat=GEO.latMax-(py/resH)*(GEO.latMax-GEO.latMin);
      // Map to grid coords (floating point)
      const gi=(GEO.latMax-lat)/((GEO.latMax-GEO.latMin)/(rows-1));
      const gj=(lon-GEO.lonMin)/((GEO.lonMax-GEO.lonMin)/(cols-1));
      const i0=Math.floor(gi),j0=Math.floor(gj);
      const i1=Math.min(i0+1,rows-1),j1=Math.min(j0+1,cols-1);
      const fi=gi-i0,fj=gj-j0;
      // Bilinear interpolation
      const v=(1-fi)*(1-fj)*grid[i0][j0]+(1-fi)*fj*grid[i0][j1]+fi*(1-fj)*grid[i1][j0]+fi*fj*grid[i1][j1];
      const rgb=riskToRGB(v);
      const idx=(py*resW+px)*4;
      img.data[idx]=rgb[0];img.data[idx+1]=rgb[1];img.data[idx+2]=rgb[2];img.data[idx+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  return cv;
}

// ── Grid canvases ──
function drawTradGrid(cv, avgRisk){
  if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.offsetWidth*dpr;cv.height=cv.offsetHeight*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const W=cv.offsetWidth,H=cv.offsetHeight;
  const pad=16;
  let t=0;
  function draw(){
    ctx.clearRect(0,0,W,H);
    // Title
    ctx.fillStyle='#334155';ctx.font='9px system-ui';ctx.textAlign='center';
    ctx.fillText('上海市 — 全市统一预报值',W/2,11);
    // Fill entire Shanghai with ONE muted color
    const dimColors=['#0f1420','#131a2a','#182035','#1c2640','#1e293b'];
    const ci=Math.min(4,Math.max(0,Math.floor((avgRisk||5)/2.5)));
    ctx.globalAlpha=.65+Math.sin(t)*.08;
    drawAllDistricts(ctx,W,H,pad,()=>dimColors[ci],null,0);
    ctx.globalAlpha=1;
    // District borders (very faint)
    drawAllDistricts(ctx,W,H,pad,null,'#1e293b',.4);
    // Shanghai outline
    drawAllDistricts(ctx,W,H,pad,null,'#334155',.8);
    // Center label
    const [cx,cy]=geo2px(121.47,31.23,W,H,pad);
    ctx.fillStyle='#475569';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    const labels=['','低','低','中低','中','中','中高','高','高','极高','极高'];
    ctx.fillText(labels[avgRisk||5]||'中',cx,cy-8);
    ctx.fillStyle='#334155';ctx.font='9px system-ui';
    ctx.fillText('上海市',cx,cy+10);
    t+=.015;
    requestAnimationFrame(draw);
  }
  draw();
}

function drawPepGrid(cv){
  if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.offsetWidth*dpr;cv.height=cv.offsetHeight*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const W=cv.offsetWidth,H=cv.offsetHeight;
  const grid=S.gridRisk;
  if(!grid.length)return;
  const pad=16;
  // Build smooth heatmap (once, re-rendered each frame via clip)
  const heatmap=buildHeatmap(grid,200,200);
  let t=0;
  function draw(){
    ctx.clearRect(0,0,W,H);
    const b=geoBounds(W,H,pad);
    // Title
    ctx.fillStyle='rgba(255,193,0,.5)';ctx.font='9px system-ui';ctx.textAlign='center';
    ctx.fillText('上海市 — 225格点实时风险',W/2,11);
    // Clip to Shanghai boundary, then draw heatmap
    ctx.save();
    ctx.beginPath();
    SH.forEach(d=>{d.c.forEach(poly=>{poly.forEach(ring=>{tracePoly(ctx,ring,W,H,pad);});});});
    ctx.clip();
    ctx.globalAlpha=.8+Math.sin(t)*.1;
    ctx.drawImage(heatmap,b.ox,b.oy,b.dw,b.dh);
    ctx.globalAlpha=1;
    ctx.restore();
    // District borders
    drawAllDistricts(ctx,W,H,pad,null,'rgba(255,255,255,.15)',.5);
    // Shanghai outline (brand blue glow)
    drawAllDistricts(ctx,W,H,pad,null,'rgba(73,94,232,.7)',1);
    // Scan line
    const scanY=b.oy+((t*30)%(b.dh));
    ctx.save();
    ctx.beginPath();
    SH.forEach(d=>{d.c.forEach(poly=>{poly.forEach(ring=>{tracePoly(ctx,ring,W,H,pad);});});});
    ctx.clip();
    ctx.strokeStyle='rgba(255,193,0,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(b.ox,scanY);ctx.lineTo(b.ox+b.dw,scanY);ctx.stroke();
    ctx.restore();
    // Lat/lon axes
    ctx.fillStyle='#475569';ctx.font='7px system-ui';
    const cols=15,rows=15;
    const cw=b.dw/cols,ch=b.dh/rows;
    ctx.textAlign='center';
    for(let j=0;j<cols;j+=4){ctx.fillText((120.85+j*.1).toFixed(1)+'°',b.ox+j*cw+cw/2,b.oy+b.dh+10);}
    ctx.textAlign='right';
    for(let i=0;i<rows;i+=4){ctx.fillText((30.55+i*.1).toFixed(1)+'°',b.ox-3,b.oy+b.dh-i*ch);}
    t+=.02;
    requestAnimationFrame(draw);
  }
  draw();
}

// ── Fetch data ──
async function fetchData(){
  try{
    const url='https://api.open-meteo.com/v1/forecast?latitude=31.23&longitude=121.47&current=precipitation,temperature_2m,wind_speed_10m,wind_direction_10m&hourly=precipitation,temperature_2m&forecast_days=10&timezone=Asia/Shanghai';
    const res=await fetch(url);const data=await res.json();
    S.current.p=data.current.precipitation||0;
    S.current.t=data.current.temperature_2m||0;
    S.current.w=data.current.wind_speed_10m||0;
    S.current.wd=data.current.wind_direction_10m||0;
    S.precip=data.hourly.precipitation||[];
    S.temp=data.hourly.temperature_2m||[];
    S.loaded=true;
    updateFeedValues();
    initWaves();
    fetchGridPoints();
  }catch(e){console.error(e);fallback();}
}

function fallback(){
  for(let i=0;i<240;i++)S.precip.push(Math.max(0,Math.sin(i/12)*3+Math.random()*2-.5));
  S.current={p:.2,t:22,w:4.5,wd:135};S.loaded=true;
  updateFeedValues();initWaves();generateGrid();
}

function updateFeedValues(){
  document.getElementById('fGfs').textContent=S.precip[0]?.toFixed(1)+'mm';
  document.getElementById('fEra5').textContent=S.current.p.toFixed(1)+'mm';
  document.getElementById('fStn').textContent=S.current.t.toFixed(1)+'°C';
  document.getElementById('fWind').textContent=S.current.w.toFixed(1)+'m/s';
}

function initWaves(){
  const p=S.precip.slice(0,80);
  // Traditional: single muted line
  drawWave('cvTradWave',p,['#334155']);
  // Pep: 4 source lines + fused
  const era5=p.map((v,i)=>v*.8+Math.sin(i/5)*.5+Math.random()*.3);
  const stn=p.map((v,i)=>v*.9+Math.cos(i/7)*.4+(Math.random()-.5)*.4);
  const wind=p.map((v,i)=>v*.3+Math.sin(i/4)*1.2+Math.random()*.5);
  drawWave('cvPepWave',[p,era5,stn,wind],['#495EE8','#34d399','#fbbf24','#f472b6'],true);
}

async function fetchGridPoints(){
  const points=[[30.55,120.85],[30.55,122.25],[31.95,120.85],[31.95,122.25],[31.25,121.55],[30.75,121.15],[31.55,121.85],[31.05,121.45],[31.75,121.05],[31.45,122.05]];
  const gd={};
  try{
    for(const [la,lo] of points){
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&hourly=precipitation&forecast_days=3&timezone=Asia/Shanghai`);
      const d=await r.json();
      const p72=(d.hourly.precipitation||[]).slice(0,72);
      gd[la+'_'+lo]={total:p72.reduce((a,b)=>a+b,0),heavy:p72.filter(v=>v>=1.5).length};
    }
  }catch(e){}
  generateGrid(points,gd);
}

function generateGrid(points,gd){
  const lats=[],lons=[];
  for(let la=30.55;la<=31.95;la=Math.round((la+.1)*100)/100)lats.push(la);
  for(let lo=120.85;lo<=122.25;lo=Math.round((lo+.1)*100)/100)lons.push(lo);
  S.gridRisk=[];
  for(let i=0;i<lats.length;i++){
    const row=[];
    for(let j=0;j<lons.length;j++){
      const la=lats[i],lo=lons[j];
      let val={total:5,heavy:1};
      if(points&&gd){
        let minD=Infinity;
        for(const[pla,plo]of points){const d=Math.sqrt((la-pla)**2+(lo-plo)**2);if(d<minD&&gd[pla+'_'+plo]){minD=d;val=gd[pla+'_'+plo];}}
      }
      const noise=Math.sin(la*50)*Math.cos(lo*50)*3;
      row.push(Math.max(1,Math.min(10,Math.round(val.total/8+val.heavy/2+noise))));
    }
    S.gridRisk.push(row);
  }
  drawPepGrid(document.getElementById('cvPepGrid'));
  const allVals=S.gridRisk.flat();
  const avgR=Math.round(allVals.reduce((a,b)=>a+b,0)/allVals.length);
  drawTradGrid(document.getElementById('cvTradGrid'),avgR);
  updateOutputs();
}


function updateOutputs(){
  if(!S.gridRisk.length)return;
  // Pep: detailed risk
  const allR=S.gridRisk.flat();
  const avgR=allR.reduce((a,b)=>a+b,0)/allR.length;
  const pepR=Math.round(avgR);
  document.getElementById('pepRisk').textContent='r'+pepR;

  // Traditional: coarse
  const tradLabels=['','低','低','中低','中','中','中高','高','高','极高','极高'];
  document.getElementById('tradRisk').textContent=tradLabels[pepR]||'中';

  // Prob distribution
  const counts=Array(10).fill(0);
  allR.forEach(v=>counts[v-1]++);
  const total=allR.length;
  for(let i=0;i<10;i++){
    const pct=counts[i]/total;
    document.getElementById('pb'+i).style.height=Math.max(2,pct*32*3)+'px';
  }

  // Trading signals
  const heavyPct=S.precip.slice(0,72).filter(v=>v>=1.5).length/72;
  if(heavyPct>.15){
    document.getElementById('pepSignal').textContent='▲ 高风险';
    document.getElementById('pepSignal').style.color='var(--red)';
    document.getElementById('tradSignal').textContent='—';
    document.getElementById('tradSignal').style.color='#475569';
  } else if(heavyPct>.05){
    document.getElementById('pepSignal').textContent='◆ 关注';
    document.getElementById('pepSignal').style.color='var(--amber)';
    document.getElementById('tradSignal').textContent='—';
    document.getElementById('tradSignal').style.color='#475569';
  } else {
    document.getElementById('pepSignal').textContent='▼ 低风险';
    document.getElementById('pepSignal').style.color='var(--green)';
    document.getElementById('tradSignal').textContent='—';
    document.getElementById('tradSignal').style.color='#475569';
  }
}

// ── Jitter ──
setInterval(()=>{
  if(!S.loaded)return;
  S.current.p=Math.max(0,S.current.p+(Math.random()-.5)*.08);
  S.current.t+=+(Math.random()-.5)*.03;
  S.current.w=Math.max(0,S.current.w+(Math.random()-.5)*.15);
  updateFeedValues();
},2000);

// ── Init ──
initParticles();
fetchData();
setInterval(fetchData,300000);
</script>
